#
# hypridle — écran de veille « aerials Apple »
#
# Enchaînement : 5 min sans activité -> les vidéos s'affichent en plein écran ;
# la moindre activité les coupe. 15 min -> extinction de l'écran.
#

general {
    # Laisse les applis (lecteur vidéo, visio...) suspendre la mise en veille.
    ignore_dbus_inhibit = false
    # Pas de verrouillage ici : hyprlock n'est pas installé. Si tu l'ajoutes un
    # jour, mets sa commande dans lock_cmd et ajoute un listener dédié.
}

# 5 min : les aerials
listener {
    timeout = 300
    on-timeout = /home/erwan/Vidéos/Apple/aerial-screensaver.sh start
    on-resume  = /home/erwan/Vidéos/Apple/aerial-screensaver.sh stop
}

# 15 min : écran éteint. On arrête d'abord les vidéos, inutile de décoder dans
# le noir — et ça évite de retrouver gslapper actif au réveil.
listener {
    timeout = 900
    on-timeout = /home/erwan/Vidéos/Apple/aerial-screensaver.sh stop; hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
